{% extends "base.html" %}{% block title %}Store Partner Signup | BeautyDrop Canada{% endblock %}{% block content %}
<section class="auth-shell"><div class="auth-card auth-wide"><div class="eyebrow">BeautyDrop partner</div><h1>Apply as a beauty store</h1><p class="muted">Create your merchant application. After approval, your login opens your private Store Dashboard.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="split"><div class="field"><label>Business name *</label><input class="input" name="store_name" required></div><div class="field"><label>Contact name *</label><input class="input" name="name" required></div></div><div class="split"><div class="field"><label>Email *</label><input class="input" type="email" name="email" required></div><div class="field"><label>Phone *</label><input class="input" name="phone" required></div></div><div class="field"><label>Store address *</label><input class="input" name="address" required></div><div class="split"><div class="field"><label>City *</label><input class="input" name="city" required></div><div class="field"><label>Province *</label><input class="input" name="province" value="Ontario" required></div></div><div class="split"><div class="field"><label>Postal code *</label><input class="input" name="postal_code" required></div><div class="field"><label>Business website</label><input class="input" name="website"></div></div><div class="field"><label>Business number (optional)</label><input class="input" name="business_number"></div><div class="field"><label>Password *</label><input class="input" type="password" name="password" minlength="10" required></div><label class="small consent-row"><input type="checkbox" name="merchant_terms" value="yes" required><span>I agree to the <a class="text-link" href="{{ url_for('merchant_agreement') }}">Merchant Agreement</a>.</span></label><button class="btn btn-primary" style="width:100%">Submit Store Application</button></form></div></section>{% endblock %}
