{% extends "base.html" %}{% block title %}Sign In | BeautyDrop Canada{% endblock %}{% block content %}
<section class="auth-shell"><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="eyebrow">Secure account access</div><h1>Welcome back</h1><p class="muted">Sign in to your BeautyDrop dashboard.</p><div class="field"><label>Email</label><input class="input" name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input class="input" name="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary" style="width:100%" type="submit">Sign in</button><p class="small" style="text-align:center;margin-top:16px"><a class="text-link" href="{{ url_for('forgot_password') }}">Forgot password?</a> · New store? <a class="text-link" href="{{ url_for('store_signup') }}">Create an account</a></p></form></section>
{% endblock %}
