{% extends "base.html" %}{% block title %}Edit {{ d.code }} | BeautyDrop Canada{% endblock %}{% block content %}
<section class="dashboard"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Edit before pickup</div><h1>{{ d.code }}</h1><p class="muted">Changes are allowed until pickup begins.</p></div><a class="btn btn-secondary" href="{{ url_for('store_delivery_detail', did=d.id) }}">Back</a></div><form class="panel form-wide" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="split"><div class="field"><label>Customer</label><input class="input" name="customer" value="{{ d.customer }}" required></div><div class="field"><label>Phone</label><input class="input" name="phone" value="{{ d.phone }}" required></div></div><div class="field"><label>Delivery address</label><textarea class="textarea" name="address" required>{{ d.address }}</textarea></div><div class="split"><div class="field"><label>Distance (km)</label><input class="input" name="km" type="number" min="0" step="0.1" value="{{ d.km }}"></div><div class="field"><label>Delivery window</label><input class="input" name="delivery_window" value="{{ schedule.delivery_window if schedule else '' }}"></div></div>{% if schedule and schedule.scheduled_for %}<div class="split"><div class="field"><label>Date</label><input class="input" type="date" name="delivery_date" value="{{ schedule.scheduled_for.strftime('%Y-%m-%d') }}"></div><div class="field"><label>Time</label><input class="input" type="time" name="delivery_time" value="{{ schedule.scheduled_for.strftime('%H:%M') }}"></div></div>{% endif %}<div class="field"><label>Instructions</label><textarea class="textarea" name="instructions">{{ d.instructions or '' }}</textarea></div><button class="btn btn-primary">Save Changes</button></form></div></section>{% endblock %}
