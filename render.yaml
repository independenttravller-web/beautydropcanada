services:
  - type: web
    name: beautydrop-canada
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beautydrop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: beautydrop-db
    plan: free
