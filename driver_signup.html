{% extends "base.html" %}{% block title %}Driver Application | BeautyDrop Canada{% endblock %}{% block content %}
<section class="auth-shell"><div class="auth-card"><div class="eyebrow">Driver application</div><h1>Become a BeautyDrop driver</h1><p class="muted">Create your driver application. BeautyDrop must approve the account before you can accept assigned deliveries.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>Full name</label><input class="input" name="name" required></div><div class="field"><label>Email</label><input class="input" type="email" name="email" required></div><div class="field"><label>Password</label><input class="input" type="password" name="password" minlength="10" required></div><label class="small consent-row"><input type="checkbox" name="driver_terms" value="yes" required><span>I agree to the <a class="text-link" href="{{ url_for('driver_agreement') }}">Driver Agreement</a>.</span></label><button class="btn btn-primary" style="width:100%">Submit Driver Application</button></form></div></section>{% endblock %}
